apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ventas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ventas
  template:
    metadata:
      labels:
        app: backend-ventas
    spec:
      containers:
        - name: backend-ventas
          image: 958787593221.dkr.ecr.us-east-1.amazonaws.com/proyecto-backend-ventas:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_ENDPOINT
              value: "localhost"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "test"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ventas
spec:
  type: ClusterIP
  selector:
    app: backend-ventas
  ports:
    - port: 8080
      targetPort: 8080