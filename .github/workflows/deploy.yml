name: Deploy to AWS EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: proyecto-semestral-eks

  ECR_FRONTEND: proyecto-frontend
  ECR_BACKEND_VENTAS: proyecto-backend-ventas
  ECR_BACKEND_DESPACHOS: proyecto-backend-despachos

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push Frontend
        run: |
          docker build -t $ECR_FRONTEND ./front_despacho
          docker tag $ECR_FRONTEND:latest ${{ steps.login-ecr.outputs.registry }}/$ECR_FRONTEND:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_FRONTEND:latest

      - name: Build y push Backend Ventas
        run: |
          docker build -t $ECR_BACKEND_VENTAS ./back-Ventas_SpringBoot
          docker tag $ECR_BACKEND_VENTAS:latest ${{ steps.login-ecr.outputs.registry }}/$ECR_BACKEND_VENTAS:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_BACKEND_VENTAS:latest

      - name: Build y push Backend Despachos
        run: |
          docker build -t $ECR_BACKEND_DESPACHOS ./back-Despachos_SpringBoot
          docker tag $ECR_BACKEND_DESPACHOS:latest ${{ steps.login-ecr.outputs.registry }}/$ECR_BACKEND_DESPACHOS:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_BACKEND_DESPACHOS:latest

      - name: Configurar kubectl con EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Desplegar en Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Reiniciar deployments
        run: |
          kubectl rollout restart deployment/frontend
          kubectl rollout restart deployment/backend-ventas
          kubectl rollout restart deployment/backend-despachos

      - name: Verificar estado
        run: |
          kubectl get pods
          kubectl get svc